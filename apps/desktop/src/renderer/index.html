<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 学习助手</title>
    <!-- Material Symbols -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
    <!-- Roboto + Noto Sans SC + Noto Serif SC（标题衬线） -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap"
    />
    <!-- 首屏前恢复持久化主题，避免闪烁 -->
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem('ai-reader-theme');
          document.documentElement.dataset.theme =
            stored === 'white' || stored === 'black-gold' ? stored : 'black-gold';
        } catch (error) {
          document.documentElement.dataset.theme = 'black-gold';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
